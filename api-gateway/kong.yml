_format_version: "3.0"

services:
  - name: auth-service
    url: http://host.docker.internal:8080
    routes:
      - name: auth-routes
        paths:
          - /api/auth
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Content-Type", "Authorization"]
          exposed_headers: ["X-Total-Count"]
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
          policy: local
      - name: jwt
        config:
          secret: "your-jwt-secret-key"
          key_claim_name: "iss"
          algorithm: "HS256"

  - name: user-service
    url: http://host.docker.internal:8081
    routes:
      - name: user-routes
        paths:
          - /api/users
        strip_path: true
