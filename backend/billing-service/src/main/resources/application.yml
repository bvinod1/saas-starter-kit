server:
  port: 8084
  servlet:
    context-path: /billing

spring:
  application:
    name: billing-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/saas_starter_kit
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
  
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/auth/realms/saas-starter-kit
  
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: basic

# Zoho Billing Configuration
zoho:
  billing:
    access-token: ${ZOHO_BILLING_ACCESS_TOKEN:your-access-token-here}
    organization-id: ${ZOHO_BILLING_ORG_ID:your-org-id-here}
    webhook-secret: ${ZOHO_BILLING_WEBHOOK_SECRET:your-webhook-secret-here}
    api-base-url: ${ZOHO_BILLING_API_URL:https://www.zohoapis.com/billing/v1}
    api-timeout: 30000
    retry-attempts: 3
    retry-delay: 1000
    webhook-validation-enabled: true
    default-currency: USD
    default-timezone: UTC

# Subscription Management Configuration
subscription:
  sync:
    enabled: true
    interval: 3600000 # 1 hour in milliseconds
    batch-size: 100
    retry-delay: 300000 # 5 minutes in milliseconds
    max-retries: 3
  
  webhook:
    enabled: true
    timeout: 30000 # 30 seconds
    max-payload-size: 1048576 # 1MB
  
  feature-access:
    cache-enabled: true
    cache-ttl: 300000 # 5 minutes in milliseconds
  
  usage-tracking:
    enabled: true
    batch-size: 1000
    flush-interval: 60000 # 1 minute in milliseconds

# Logging Configuration
logging:
  level:
    com.saasstarterkit.billing: INFO
    com.saasstarterkit.billing.adapters.zoho: DEBUG
    com.saasstarterkit.billing.service: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Server Configuration
server:
  port: 8084
  servlet:
    context-path: /billing
  
# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Security Configuration
security:
  jwt:
    secret: ${JWT_SECRET:your-jwt-secret-here}
    expiration: 86400000 # 24 hours in milliseconds
  
  cors:
    allowed-origins: 
      - http://localhost:3000
      - http://localhost:8080
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

# Database Migration
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true 