# Test Configuration for Notification Service
spring:
  application:
    name: notification-service-test
  
  datasource:
    url: jdbc:tc:postgresql:13://localhost/test
    username: test_user
    password: test_password
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  rabbitmq:
    host: localhost
    port: 5672
    username: test_user
    password: test_password
    virtual-host: test_vhost
    listener:
      simple:
        concurrency: 1
        max-concurrency: 2
        prefetch: 1
        default-requeue-rejected: false
  
  mail:
    host: localhost
    port: 1025
    username: test@test.com
    password: test_password
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  
  cache:
    type: simple
    cache-names: notification-templates,user-preferences

# Test Notification Providers Configuration
notification:
  providers:
    email:
      sendgrid:
        api-key: test_api_key
        from-email: test@test.com
        from-name: Test App
      smtp:
        enabled: true
        from-email: test@test.com
        from-name: Test App
    
    sms:
      twilio:
        enabled: true
        account-sid: test_account_sid
        auth-token: test_auth_token
        from-number: +1234567890
      max-length: 160
      rate-limit-per-minute: 100
    
    push:
      firebase:
        enabled: true
        project-id: test-project
        private-key-id: test_private_key_id
        private-key: test_private_key
        client-email: test@test.com
        client-id: test_client_id
      max-title-length: 50
      max-body-length: 200
      rate-limit-per-minute: 100
    
    in-app:
      enabled: true
      max-title-length: 100
      max-body-length: 500
      rate-limit-per-minute: 200
      websocket:
        destination-prefix: /user
    
    webhook:
      enabled: true
      timeout-seconds: 5
      max-retries: 2
      rate-limit-per-minute: 100
      default-headers: '{"X-Test-Header": "Test-Value"}'
  
  templates:
    cache-ttl: 60 # 1 minute for tests
    default-language: en
  
  retry:
    max-attempts: 2
    initial-interval: 100ms
    multiplier: 2.0
    max-interval: 1000ms
  
  dead-letter:
    queue: test.notification.dlq
    exchange: test.notification.dlx
    routing-key: test.notification.dlq

# Test Tenant Configuration
tenant:
  default-schema: test_shared
  schema-prefix: test_tenant_

# Test Logging
logging:
  level:
    com.saasstarterkit.notification: DEBUG
    org.springframework.amqp: DEBUG
    org.springframework.mail: DEBUG
    org.testcontainers: INFO
  pattern:
    console: "%d{HH:mm:ss} - %msg%n"

# Test Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
