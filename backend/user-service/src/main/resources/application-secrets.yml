# Secret Management Configuration
# This file contains configuration for different secret management backends

# AWS Secrets Manager Configuration
aws:
  secrets:
    manager:
      region: ${AWS_REGION:us-east-1}
      cache:
        ttl: ${AWS_SECRETS_CACHE_TTL:300}
        max-size: ${AWS_SECRETS_CACHE_MAX_SIZE:1000}
      retry:
        max-attempts: ${AWS_SECRETS_RETRY_MAX_ATTEMPTS:3}
        delay-ms: ${AWS_SECRETS_RETRY_DELAY_MS:1000}

# Google Cloud Secret Manager Configuration
gcp:
  secrets:
    manager:
      project-id: ${GCP_PROJECT_ID}
      cache:
        ttl: ${GCP_SECRETS_CACHE_TTL:300}
        max-size: ${GCP_SECRETS_CACHE_MAX_SIZE:1000}
      retry:
        max-attempts: ${GCP_SECRETS_RETRY_MAX_ATTEMPTS:3}
        delay-ms: ${GCP_SECRETS_RETRY_DELAY_MS:1000}

# Azure Key Vault Configuration
azure:
  keyvault:
    url: ${AZURE_KEYVAULT_URL}
    tenant-id: ${AZURE_TENANT_ID}
    client-id: ${AZURE_CLIENT_ID}
    client-secret: ${AZURE_CLIENT_SECRET}
    cache:
      ttl: ${AZURE_KEYVAULT_CACHE_TTL:300}
      max-size: ${AZURE_KEYVAULT_CACHE_MAX_SIZE:1000}
    retry:
      max-attempts: ${AZURE_KEYVAULT_RETRY_MAX_ATTEMPTS:3}
      delay-ms: ${AZURE_KEYVAULT_RETRY_DELAY_MS:1000}

# HashiCorp Vault Configuration (Local/Development)
vault:
  url: ${VAULT_URL:http://localhost:8200}
  token: ${VAULT_TOKEN}
  namespace: ${VAULT_NAMESPACE:}
  cache:
    ttl: ${VAULT_CACHE_TTL:300}
    max-size: ${VAULT_CACHE_MAX_SIZE:1000}
  retry:
    max-attempts: ${VAULT_RETRY_MAX_ATTEMPTS:3}
    delay-ms: ${VAULT_RETRY_DELAY_MS:1000}

# Secret Management Backend Selection
secrets:
  backend:
    type: ${SECRETS_BACKEND_TYPE:local}  # aws, gcp, azure, vault, local
    enabled: ${SECRETS_MANAGER_ENABLED:false}
    fallback-to-env: ${SECRETS_FALLBACK_TO_ENV:true}
    refresh-interval: ${SECRETS_REFRESH_INTERVAL:300000}

# Secret Namespace Structure
secrets:
  namespaces:
    common: "common"
    dev: "dev"
    staging: "staging"
    prod: "prod"
    tenant-specific: "tenants"
    
  # Secret path templates
  paths:
    database:
      credentials: "${secrets.namespaces.common}/database"
      tenant-credentials: "${secrets.namespaces.tenant-specific}/{tenant-id}/database"
    
    security:
      jwt: "${secrets.namespaces.common}/security/jwt"
      encryption: "${secrets.namespaces.common}/security/encryption"
      api-keys: "${secrets.namespaces.common}/security/api-keys"
    
    external:
      email: "${secrets.namespaces.common}/external/email"
      sms: "${secrets.namespaces.common}/external/sms"
      payment: "${secrets.namespaces.common}/external/payment"
    
    tenant:
      config: "${secrets.namespaces.tenant-specific}/{tenant-id}/config"
      features: "${secrets.namespaces.tenant-specific}/{tenant-id}/features"
      integrations: "${secrets.namespaces.tenant-specific}/{tenant-id}/integrations"
