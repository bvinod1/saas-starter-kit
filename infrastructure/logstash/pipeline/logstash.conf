input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json
  }
  udp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse Spring Boot logs
  if [type] == "spring-boot" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:logger} - %{GREEDYDATA:message}" }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    }
  }
  
  # Handle JSON logs from Spring Boot
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # CRITICAL: Extract multi-tenant context and compliance information
  # This ensures tenant isolation at the data level
  if [correlationId] {
    mutate {
      add_field => { "correlation_id" => "%{correlationId}" }
    }
  }
  
  if [requestId] {
    mutate {
      add_field => { "request_id" => "%{requestId}" }
    }
  }
  
  # TENANT ISOLATION: Extract and validate tenant context
  if [tenantId] {
    mutate {
      add_field => { "tenant_id" => "%{tenantId}" }
      add_field => { "tenant_id_normalized" => "%{tenantId}" }
    }
    
    # Validate tenant ID format and security
    if [tenantId] == "SECURITY_VIOLATION" {
      mutate {
        add_field => { "security_violation" => "true" }
        add_field => { "audit_required" => "true" }
        add_field => { "compliance_level" => "CRITICAL" }
      }
    }
  } else {
    # No tenant ID - mark as security violation
    mutate {
      add_field => { "tenant_id" => "SECURITY_VIOLATION" }
      add_field => { "tenant_id_normalized" => "security_violation" }
      add_field => { "security_violation" => "true" }
      add_field => { "audit_required" => "true" }
      add_field => { "compliance_level" => "CRITICAL" }
    }
  }
  
  if [tenantName] {
    mutate {
      add_field => { "tenant_name" => "%{tenantName}" }
    }
  }
  
  if [organizationId] {
    mutate {
      add_field => { "organization_id" => "%{organizationId}" }
    }
  }
  
  if [userId] {
    mutate {
      add_field => { "user_id" => "%{userId}" }
    }
  }
  
  if [userEmail] {
    mutate {
      add_field => { "user_email" => "%{userId}" }
    }
  }
  
  if [sessionId] {
    mutate {
      add_field => { "session_id" => "%{sessionId}" }
    }
  }
  
  if [complianceLevel] {
    mutate {
      add_field => { "compliance_level" => "%{complianceLevel}" }
    }
  }
  
  if [dataSensitivity] {
    mutate {
      add_field => { "data_sensitivity" => "%{dataSensitivity}" }
    }
  }
  
  if [auditRequired] {
    mutate {
      add_field => { "audit_required" => "%{auditRequired}" }
    }
  }
  
  # SECURITY CONTEXT: Extract security-related information
  if [securityLevel] {
    mutate {
      add_field => { "security_level" => "%{securityLevel}" }
    }
  }
  
  if [accessLevel] {
    mutate {
      add_field => { "access_level" => "%{accessLevel}" }
    }
  }
  
  if [tenantIsolation] {
    mutate {
      add_field => { "tenant_isolation" => "%{tenantIsolation}" }
    }
  }
  
  # Extract business event context
  if [eventType] {
    mutate {
      add_field => { "event_type" => "%{eventType}" }
    }
  }
  
  if [eventId] {
    mutate {
      add_field => { "event_id" => "%{eventId}" }
    }
  }
  
  # Extract security event context
  if [securityEventType] {
    mutate {
      add_field => { "security_event_type" => "%{securityEventType}" }
    }
  }
  
  if [severity] {
    mutate {
      add_field => { "severity" => "%{severity}" }
    }
  }
  
  # Extract data access context
  if [dataAccessType] {
    mutate {
      add_field => { "data_access_type" => "%{dataAccessType}" }
    }
  }
  
  if [operation] {
    mutate {
      add_field => { "operation" => "%{operation}" }
    }
  }
  
  # Extract tenant isolation context
  if [isolationEventType] {
    mutate {
      add_field => { "isolation_event_type" => "%{isolationEventType}" }
    }
  }
  
  if [isolationLevel] {
    mutate {
      add_field => { "isolation_level" => "%{isolationLevel}" }
    }
  }
  
  # Extract compliance audit context
  if [auditType] {
    mutate {
      add_field => { "audit_type" => "%{auditType}" }
    }
  }
  
  if [complianceStandard] {
    mutate {
      add_field => { "compliance_standard" => "%{complianceStandard}" }
    }
  }
  
  # Add service name and environment
  mutate {
    add_field => { "service" => "user-service" }
    add_field => { "environment" => "development" }
    add_field => { "platform" => "multi-tenant-saas" }
  }
  
  # Add compliance metadata
  mutate {
    add_field => { "data_governance" => "enabled" }
    add_field => { "tenant_isolation" => "enabled" }
    add_field => { "audit_trail" => "enabled" }
  }
  
  # Parse timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # TENANT DATA CLASSIFICATION: Add data classification tags based on tenant and content
  if [dataSensitivity] {
    if [dataSensitivity] == "PII_HIGH" {
      mutate {
        add_field => { "data_classification" => "PII_HIGH" }
        add_field => { "compliance_required" => "true" }
        add_field => { "retention_policy" => "7_years" }
        add_field => { "encryption_required" => "true" }
        add_field => { "access_control" => "strict" }
      }
    } else if [dataSensitivity] == "PII_MEDIUM" {
      mutate {
        add_field => { "data_classification" => "PII_MEDIUM" }
        add_field => { "compliance_required" => "true" }
        add_field => { "retention_policy" => "3_years" }
        add_field => { "encryption_required" => "true" }
        add_field => { "access_control" => "standard" }
      }
    } else if [dataSensitivity] == "PII_LOW" {
      mutate {
        add_field => { "data_classification" => "PII_LOW" }
        add_field => { "compliance_required" => "false" }
        add_field => { "retention_policy" => "1_year" }
        add_field => { "encryption_required" => "false" }
        add_field => { "access_control" => "basic" }
      }
    } else {
      mutate {
        add_field => { "data_classification" => "PUBLIC" }
        add_field => { "compliance_required" => "false" }
        add_field => { "retention_policy" => "90_days" }
        add_field => { "encryption_required" => "false" }
        add_field => { "access_control" => "public" }
      }
    }
  }
  
  # TENANT COMPLIANCE FRAMEWORK: Add compliance level tags
  if [complianceLevel] {
    if [complianceLevel] == "HIPAA" {
      mutate {
        add_field => { "compliance_framework" => "HIPAA" }
        add_field => { "data_protection" => "encrypted_at_rest_and_transit" }
        add_field => { "access_controls" => "role_based" }
        add_field => { "audit_required" => "true" }
        add_field => { "retention_required" => "true" }
      }
    } else if [complianceLevel] == "SOX_PCI" {
      mutate {
        add_field => { "compliance_framework" => "SOX_PCI" }
        add_field => { "data_protection" => "encrypted_at_rest_and_transit" }
        add_field => { "access_controls" => "multi_factor" }
        add_field => { "audit_required" => "true" }
        add_field => { "retention_required" => "true" }
      }
    } else if [complianceLevel] == "ENTERPRISE" {
      mutate {
        add_field => { "compliance_framework" => "ENTERPRISE" }
        add_field => { "data_protection" => "encrypted_at_rest" }
        add_field => { "access_controls" => "standard" }
        add_field => { "audit_required" => "true" }
        add_field => { "retention_required" => "true" }
      }
    } else if [complianceLevel] == "SECURITY_VIOLATION" {
      mutate {
        add_field => { "compliance_framework" => "SECURITY_VIOLATION" }
        add_field => { "data_protection" => "encrypted_at_rest_and_transit" }
        add_field => { "access_controls" => "restricted" }
        add_field => { "audit_required" => "true" }
        add_field => { "retention_required" => "true" }
        add_field => { "security_alert" => "true" }
      }
    } else {
      mutate {
        add_field => { "compliance_framework" => "BASIC" }
        add_field => { "data_protection" => "standard" }
        add_field => { "access_controls" => "basic" }
        add_field => { "audit_required" => "false" }
        add_field => { "retention_required" => "false" }
      }
    }
  }
  
  # TENANT ISOLATION TAGS: Add isolation level tags
  if [tenantId] {
    if [tenantId] == "SECURITY_VIOLATION" {
      mutate {
        add_field => { "isolation_level" => "RESTRICTED" }
        add_field => { "cross_tenant_access" => "blocked" }
        add_field => { "data_isolation" => "enforced" }
        add_field => { "security_monitoring" => "enabled" }
      }
    } else if [tenantId] =~ /^enterprise_/ {
      mutate {
        add_field => { "isolation_level" => "STRICT" }
        add_field => { "cross_tenant_access" => "blocked" }
        add_field => { "data_isolation" => "enforced" }
        add_field => { "security_monitoring" => "enabled" }
      }
    } else if [tenantId] =~ /^healthcare_/ {
      mutate {
        add_field => { "isolation_level" => "STRICT" }
        add_field => { "cross_tenant_access" => "blocked" }
        add_field => { "data_isolation" => "enforced" }
        add_field => { "security_monitoring" => "enabled" }
      }
    } else if [tenantId] =~ /^financial_/ {
      mutate {
        add_field => { "isolation_level" => "STRICT" }
        add_field => { "cross_tenant_access" => "blocked" }
        add_field => { "data_isolation" => "enforced" }
        add_field => { "security_monitoring" => "enabled" }
      }
    } else {
      mutate {
        add_field => { "isolation_level" => "STANDARD" }
        add_field => { "cross_tenant_access" => "blocked" }
        add_field => { "data_isolation" => "enforced" }
        add_field => { "security_monitoring" => "enabled" }
      }
    }
  }
  
  # Remove fields that might cause issues
  mutate {
    remove_field => [ "message" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    # TENANT ISOLATION: Use tenant-specific index pattern for data isolation
    index => "saas-logs-%{tenant_id_normalized}-%{+YYYY.MM.dd}"
    template_name => "saas-logs-multi-tenant-secure"
    template => {
      "index_patterns" => ["saas-logs-*-*"]
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
        "index.lifecycle.name" => "saas-logs-policy"
        "index.lifecycle.rollover_alias" => "saas-logs"
        # Security settings for tenant isolation
        "index.security.enabled" => true
        "index.security.tenant.isolation" => true
        "index.security.cross_tenant_access" => false
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "level" => { "type" => "keyword" }
          "logger" => { "type" => "keyword" }
          "message" => { "type" => "text" }
          
          # Multi-tenant context with security
          "tenant_id" => { "type" => "keyword" }
          "tenant_id_normalized" => { "type" => "keyword" }
          "tenant_name" => { "type" => "keyword" }
          "organization_id" => { "type" => "keyword" }
          "user_id" => { "type" => "keyword" }
          "user_email" => { "type" => "keyword" }
          "session_id" => { "type" => "keyword" }
          
          # Security and compliance
          "security_violation" => { "type" => "boolean" }
          "security_level" => { "type" => "keyword" }
          "access_level" => { "type" => "keyword" }
          "tenant_isolation" => { "type" => "keyword" }
          "isolation_level" => { "type" => "keyword" }
          "cross_tenant_access" => { "type" => "keyword" }
          "data_isolation" => { "type" => "keyword" }
          "security_monitoring" => { "type" => "keyword" }
          
          # Compliance and governance
          "compliance_level" => { "type" => "keyword" }
          "data_sensitivity" => { "type" => "keyword" }
          "audit_required" => { "type" => "boolean" }
          "compliance_framework" => { "type" => "keyword" }
          "data_classification" => { "type" => "keyword" }
          "compliance_required" => { "type" => "boolean" }
          "retention_policy" => { "type" => "keyword" }
          "data_protection" => { "type" => "keyword" }
          "access_controls" => { "type" => "keyword" }
          "encryption_required" => { "type" => "boolean" }
          "retention_required" => { "type" => "boolean" }
          
          # Business events
          "event_type" => { "type" => "keyword" }
          "event_id" => { "type" => "keyword" }
          
          # Security events
          "security_event_type" => { "type" => "keyword" }
          "severity" => { "type" => "keyword" }
          
          # Data access
          "data_access_type" => { "type" => "keyword" }
          "operation" => { "type" => "keyword" }
          
          # Tenant isolation
          "isolation_event_type" => { "type" => "keyword" }
          
          # Compliance audit
          "audit_type" => { "type" => "keyword" }
          "compliance_standard" => { "type" => "keyword" }
          
          # Service and environment
          "service" => { "type" => "keyword" }
          "environment" => { "type" => "keyword" }
          "platform" => { "type" => "keyword" }
          
          # Governance
          "data_governance" => { "type" => "keyword" }
          "audit_trail" => { "type" => "keyword" }
          
          # Performance and technical
          "thread" => { "type" => "keyword" }
          "stack_trace" => { "type" => "text" }
          "duration_ms" => { "type" => "long" }
          "metric_type" => { "type" => "keyword" }
          
          # Correlation and tracking
          "correlation_id" => { "type" => "keyword" }
          "request_id" => { "type" => "keyword" }
        }
      }
    }
  }
  stdout { codec => rubydebug }
} 