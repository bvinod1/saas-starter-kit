openapi: "3.1.0"
info:
  title: Auth Service API
  version: "1.0.0"
  description: Authentication and identity management endpoints.

servers:
  - url: /api/v1/auth
    description: Via Kong proxy

security:
  - bearerAuth: []

paths:
  /login:
    post:
      summary: Authenticate user and obtain tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'

  /logout:
    post:
      summary: Revoke refresh token
      operationId: logout
      responses:
        "204":
          description: Logged out
        "401":
          $ref: '#/components/responses/Unauthorized'

  /refresh:
    post:
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /mfa/enroll:
    post:
      summary: Enroll TOTP MFA for the current user
      operationId: enrollMfa
      responses:
        "200":
          description: QR code and secret returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollResponse'

  /mfa/verify:
    post:
      summary: Verify TOTP code and complete MFA setup
      operationId: verifyMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        "204":
          description: MFA verified

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password, tenantSubdomain]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        tenantSubdomain:
          type: string
        mfaCode:
          type: string
          pattern: '^[0-9]{6}$'

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds until access token expires
        tokenType:
          type: string
          enum: [Bearer]

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    MfaEnrollResponse:
      type: object
      properties:
        secret:
          type: string
        qrCodeUri:
          type: string

    MfaVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'

  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer

    ErrorResponse:
      description: Generic error

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
