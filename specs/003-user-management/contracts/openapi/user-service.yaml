openapi: "3.1.0"
info:
  title: User Service API
  version: "1.0.0"
  description: User management endpoints. All paths require X-Tenant-ID header.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /users:
    get:
      summary: List users for current tenant
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'

    post:
      summary: Create a new user
      operationId: createUser
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "409":
          description: Email already exists in this tenant

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get user profile
      operationId: getUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    patch:
      summary: Update user profile
      operationId: updateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      summary: Deactivate (soft-delete) user
      operationId: deleteUser
      responses:
        "204":
          description: Deactivated

  /users/{userId}/roles:
    parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Assign a role to user
      operationId: assignRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        "204":
          description: Role assigned

  /users/{userId}/erasure:
    parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Request GDPR data erasure
      operationId: requestErasure
      responses:
        "202":
          description: Erasure request accepted

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CreateUserRequest:
      type: object
      required: [email, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        roles:
          type: array
          items:
            type: string
        dynamicFields:
          type: object
          additionalProperties: true
          description: Tenant-specific profile fields

    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        dynamicFields:
          type: object
          additionalProperties: true

    AssignRoleRequest:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
        roles:
          type: array
          items:
            type: string
        dynamicFields:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    UserPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
